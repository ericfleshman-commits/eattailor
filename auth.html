<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#198f51">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EatTailor</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,#0b0d12, #0f1115 40%);
      padding:20px;
    }
    .auth-card{
      background:var(--panel);
      border:1px solid #1e2431;
      border-radius:var(--radius);
      padding:40px;
      width:100%;
      max-width:400px;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
    }
    .auth-header{
      text-align:center;
      margin-bottom:32px;
    }
    .auth-logo{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin-bottom:16px;
    }
    .auth-logo-text{
      font-size:28px;
      font-weight:700;
      color:var(--text);
      letter-spacing:-0.5px;
    }
    .auth-subtitle{
      color:var(--muted);
      font-size:14px;
    }
    .auth-form{
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .form-group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .form-label{
      font-size:13px;
      color:var(--text);
      font-weight:500;
    }
    .form-input{
      padding:12px;
      border-radius:10px;
      border:1px solid #23293a;
      background:#0f1420;
      color:var(--text);
      font-size:14px;
      outline:none;
      transition:border-color 0.2s;
    }
    .form-input:focus{
      border-color:var(--accent);
    }
    .auth-button{
      padding:12px;
      border-radius:10px;
      border:none;
      background:var(--accent);
      color:#071120;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      transition:filter 0.2s;
    }
    .auth-button:hover{
      filter:brightness(1.1);
    }
    .auth-button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .google-signin-btn{
      width:100%;
      padding:12px 24px;
      border-radius:10px;
      border:1px solid #23293a;
      background:white;
      color:#3c4043;
      font-weight:600;
      font-size:14px;
      cursor:pointer;
      transition:filter 0.2s;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
    }
    .google-signin-btn:hover{
      filter:brightness(0.95);
    }
    .google-signin-btn:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .auth-divider{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin:8px 0;
    }
    .auth-link{
      color:var(--accent);
      text-decoration:none;
      font-weight:500;
    }
    .auth-link:hover{
      text-decoration:underline;
    }
    .error-message{
      padding:12px;
      border-radius:8px;
      background:#2c1515;
      border:1px solid #5c2626;
      color:#ff6b6b;
      font-size:13px;
      display:none;
    }
    .error-message.show{
      display:block;
      animation:slideIn 0.3s ease-out;
    }
  </style>
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" fill="#198f51" opacity="0.1"/>
            <path d="M16 8C11.6 8 8 11.6 8 16C8 20.4 11.6 24 16 24C20.4 24 24 20.4 24 16C24 11.6 20.4 8 16 8ZM16 22C12.7 22 10 19.3 10 16C10 12.7 12.7 10 16 10C19.3 10 22 12.7 22 16C22 19.3 19.3 22 16 22Z" fill="#198f51"/>
            <circle cx="16" cy="14" r="2" fill="#198f51"/>
            <path d="M12 18H20V19H12V18Z" fill="#198f51"/>
          </svg>
          <span class="auth-logo-text">EatTailor</span>
        </div>
        <p class="auth-subtitle">Track your nutrition, reach your goals</p>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <button id="googleSignInBtn" class="google-signin-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase modules (using v11.0.2 - latest)
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAO85xsJZNG5e2nUokRz_C-flZuwcueLUw",
      authDomain: "eattailor.firebaseapp.com",
      projectId: "eattailor",
      storageBucket: "eattailor.firebasestorage.app",
      messagingSenderId: "307976845080",
      appId: "1:307976845080:web:4d951add50da42972a506d",
      measurementId: "G-S81Q5CB48Z"
    };

    // Initialize Firebase
    console.log('🔥 Initializing Firebase with config:', firebaseConfig);
    const app = initializeApp(firebaseConfig);
    console.log('✅ Firebase app initialized:', app.name);
    const auth = getAuth(app);
    console.log('✅ Auth initialized');
    const provider = new GoogleAuthProvider();
    console.log('✅ Google provider created');

    // DOM elements
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const errorMessage = document.getElementById('errorMessage');

    // Check if user is already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        // User is signed in, redirect to main app
        window.location.href = '/app';
      }
    });

    // Google Sign-In button click
    googleSignInBtn.addEventListener('click', async () => {
      hideError();
      googleSignInBtn.disabled = true;
      googleSignInBtn.innerHTML = '<span>Signing in...</span>';

      try {
        await signInWithPopup(auth, provider);
        // Success - onAuthStateChanged will redirect
      } catch (error) {
        console.error('Auth error:', error);
        console.error('Error code:', error.code);
        console.error('Error message:', error.message);
        showError(getErrorMessage(error.code));
        googleSignInBtn.disabled = false;
        googleSignInBtn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span>Sign in with Google</span>
        `;
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
    }

    function hideError() {
      errorMessage.classList.remove('show');
    }

    function getErrorMessage(code) {
      switch (code) {
        case 'auth/popup-closed-by-user':
          return 'Sign-in cancelled. Please try again.';
        case 'auth/popup-blocked':
          return 'Popup blocked. Please allow popups for this site.';
        case 'auth/cancelled-popup-request':
          return 'Sign-in cancelled. Please try again.';
        case 'auth/account-exists-with-different-credential':
          return 'An account already exists with this email';
        case 'auth/too-many-requests':
          return 'Too many attempts. Try again later';
        default:
          return 'Sign-in failed. Please try again';
      }
    }
  </script>
</body>
</html>
